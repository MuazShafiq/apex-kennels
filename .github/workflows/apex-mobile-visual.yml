name: Apex mobile visual review
on:
  pull_request:
    paths:
      - 'public/book/**'
      - 'src/staff-console.ts'
      - 'src/staff-invoice-approval.ts'
      - 'src/invoice-workflow-routes.ts'
      - 'src/cloudflare-worker.ts'
      - 'src/staff-transport-review.ts'
      - 'src/staff-booking-detail.ts'
      - 'src/staff-invoice-draft.ts'
      - 'src/staff-location.ts'
      - 'src/apex-brand.ts'
      - 'scripts/check-mobile-visual.mjs'
      - 'scripts/check-booking-e2e.mjs'
      - 'scripts/check-invoice-e2e.mjs'
      - 'src/invoice-approval*.ts'
      - 'src/invoice-delivery*.ts'
      - 'src/public-booking.ts'
      - 'src/intake.ts'
      - 'src/boarding-details.ts'
      - '.github/workflows/apex-mobile-visual.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.54.2
      - run: npx playwright install --with-deps chromium
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/check-mobile-visual.mjs
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/check-booking-e2e.mjs
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/check-invoice-e2e.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apex-mobile-visual
          path: mobile-*.png
          if-no-files-found: ignore
