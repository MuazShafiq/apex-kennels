name: Test foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      invoice-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apex_synthetic
          POSTGRES_PASSWORD: synthetic-local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex_synthetic -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/check-local.mjs
      - run: npm run form:check
      - run: npm run cf:check
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pg@8.16.3
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types --test scripts/check-neon-migrations.test.mjs
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/check-neon-migrations-local.mjs
        env:
          NEON_VALIDATION_LOCAL_POSTGRES_URL: postgresql://apex_synthetic:synthetic-local-ci-only@127.0.0.1:5432/postgres
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/check-invoice-db.mjs
        env:
          INVOICE_TEST_POSTGRES_URL: postgresql://apex_synthetic:synthetic-local-ci-only@127.0.0.1:5432/postgres
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/check-owner-alert-db.mjs
        env:
          OWNER_ALERT_TEST_POSTGRES_URL: postgresql://apex_synthetic:synthetic-local-ci-only@127.0.0.1:5432/postgres
