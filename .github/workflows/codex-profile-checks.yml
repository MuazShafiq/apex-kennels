name: Codex launcher profile checks
on:
  pull_request:
    paths:
      - 'scripts/codex-profiles.ps1'
      - 'scripts/install-codex-profiles.ps1'
      - 'scripts/test-codex-profiles.ps1'
      - '.github/workflows/codex-profile-checks.yml'
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: ['powershell', 'pwsh']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Codex profile installation and environment isolation
        shell: ${{ matrix.shell }}
        run: .\scripts\test-codex-profiles.ps1
